<style>
:root{
  --gold:#c9a84c;
  --gold-soft:#e3c977;
  --gold-dim:rgba(201,168,76,.22);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(ellipse 70% 40% at 50% -6%, rgba(201,168,76,.13), transparent 62%),
    radial-gradient(ellipse 90% 50% at 50% 108%, rgba(201,168,76,.06), transparent 60%),
    #0d0d0d;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}

.hook{
  text-align:center;
  margin-bottom:20px;
  max-width:400px;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 13px;
  border-radius:999px;
  border:1px solid rgba(201,168,76,.3);
  background:rgba(201,168,76,.07);
  color:var(--gold);
  font-size:.64rem;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.pill i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#27b163;
  box-shadow:0 0 0 0 rgba(39,177,99,.6);
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(39,177,99,.55)}
  70%{box-shadow:0 0 0 7px rgba(39,177,99,0)}
  100%{box-shadow:0 0 0 0 rgba(39,177,99,0)}
}

.hook-line{
  margin:13px 0 0;
  font-family:Georgia,'Times New Roman',serif;
  font-weight:700;
  font-size:clamp(1.3rem,5.4vw,1.7rem);
  line-height:1.2;
  color:#fff;
}

.hook-sub{
  margin:8px 0 0;
  color:var(--gold-soft);
  font-size:.8rem;
  line-height:1.5;
  opacity:.82;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.brand::before,
.brand::after{
  content:"";
  width:34px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-dim));
}

.brand::after{
  background:linear-gradient(90deg,var(--gold-dim),transparent);
}

.brand span{
  font-family:Georgia,'Times New Roman',serif;
  font-weight:700;
  font-size:.82rem;
  letter-spacing:.28em;
  color:var(--gold-soft);
  text-transform:uppercase;
}

.player-wrap{
  position:relative;
  width:100%;
  max-width:400px;
  padding:7px;
  border-radius:16px;
  border:1px solid var(--gold-dim);
  background:linear-gradient(165deg,rgba(201,168,76,.09),rgba(201,168,76,.02) 45%,transparent);
}

.player-wrap::before,
.player-wrap::after{
  content:"";
  position:absolute;
  width:16px;
  height:16px;
  border:1px solid rgba(201,168,76,.55);
}

.player-wrap::before{
  top:-1px;
  left:-1px;
  border-right:0;
  border-bottom:0;
  border-radius:16px 0 0 0;
}

.player-wrap::after{
  bottom:-1px;
  right:-1px;
  border-left:0;
  border-top:0;
  border-radius:0 0 16px 0;
}

.player-wrap vturb-smartplayer{
  border-radius:11px;
  overflow:hidden;
  display:block;
}

#reveal{
  display:block;
  width:100%;
  max-width:400px;
  margin-top:22px;
}

#reveal.show{
  display:block;
  animation:rise .55s cubic-bezier(.2,.8,.3,1) both;
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(20px) scale(.98);
  }
  to{
    opacity:1;
    transform:none;
  }
}

#reveal button{
  width:100%!important;
  max-width:100%!important;
  min-height:58px;
  box-shadow:
    0 10px 26px rgba(33,150,83,.32),
    0 0 0 1px rgba(201,168,76,.28);
  transition:filter .12s ease,transform .12s ease;
}

#reveal button:hover{
  filter:brightness(1.08);
}

#reveal button:active{
  transform:translateY(1px);
}

#confetti{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:9999;
}

@media(prefers-reduced-motion:reduce){
  #reveal.show{
    animation:none;
  }
}
</style>
